<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Members Wi-Fi</title>
<style>
*{box-sizing:border-box;font-family:'Inter',-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{margin:0;background:#101418;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:390px;max-width:94vw;background:#1b2027;border:1px solid #2a313b;border-radius:12px;padding:30px 26px;color:#e6eaf0}
h1{font-size:21px;margin:0 0 4px}
.sub{color:#8b97a7;font-size:13px;margin:0 0 22px}
label{display:block;font-size:12px;color:#8b97a7;margin:13px 0 5px}
input{width:100%;padding:13px;border:1px solid #2f3742;border-radius:8px;font-size:15px;background:#11151a;color:#e6eaf0}
input:focus{outline:none;border-color:#2ec2a6;box-shadow:0 0 0 2px rgba(46,194,166,.2)}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:8px;background:#2ec2a6;color:#06231d;font-size:15px;font-weight:700;cursor:pointer}
.ft{color:#5c6675;font-size:11px;margin-top:16px;text-align:center}
</style></head><body>
<form class="card" method="POST" action="/login">
<h1>Members Wi-Fi</h1>
<p class="sub">Sign in with your membership account to join <b>{{SSID}}</b>.</p>
<label>Member email</label>
<input name="email" type="email" autocomplete="username" placeholder="you@workspace.com" required>
<label>Password</label>
<input name="password" type="password" autocomplete="current-password" placeholder="Member password" required>
<button type="submit">Connect to workspace</button>
<div class="ft">Members only &middot; Workspace network</div>
</form></body></html>
